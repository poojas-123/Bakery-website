<section class="order">

<h2>   
 Gulab Jamun 🍩



 </h2>

<p>Price per item: ₹<span id="price">40</span></p>

<label>Quantity:</label>
<input type="number" id="qty" value="1" min="1" oninput="updateTotal()">

<p><strong>Total Price: ₹<span id="total">40</span></strong></p>

<button onclick="placeOrder()">Order Now</button>
</section>



<script>
const price = 40;





function updateTotal() {
  const quantity = document.getElementById("qty").value;
  const total = price * quantity;
  document.getElementById("total").innerText = total;
}

function placeOrder() {
  const quantity = document.getElementById("qty").value;
  const total = price * quantity;

  localStorage.setItem("item", " Gulab Jamun");
  localStorage.setItem("price", price);
  localStorage.setItem("quantity", quantity);
  localStorage.setItem("total", total);

  window.location.href = "ordersummary.html";
}
</script>
